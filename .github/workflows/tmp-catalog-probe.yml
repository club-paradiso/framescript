name: TEMP catalog probe (remove before merge)

on:
  push:
    branches: [claude/production-ai-provider-recovery-dwmn1j]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public Vercel AI Gateway and OpenRouter catalogs (no credentials)
        shell: python
        run: |
          import json, urllib.request
          def get(url):
              req = urllib.request.Request(url, headers={"accept": "application/json", "user-agent": "framescript-catalog-probe"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as e:
                  print("FETCH_FAIL", url, type(e).__name__, getattr(e, "code", ""))
                  return None
          gw = get("https://ai-gateway.vercel.sh/v1/models")["data"]
          def zero(p):
              return p.get("input") is not None and all(str(p.get(k, "0")) in ("0", "0.0") for k in ("input", "output"))
          for m in gw:
              p = m.get("pricing") or {}
              if zero(p) or "free" in (m.get("tags") or []) or m.get("id", "").startswith("stealth/"):
                  print("GW_ZERO", json.dumps(m))
          for mid in ["stealth/pixel-canary", "fish-audio/transcribe-1", "openai/whisper-1"]:
              ep = get(f"https://ai-gateway.vercel.sh/v1/models/{mid}/endpoints")
              print("GW_ENDPOINTS", mid, json.dumps(ep)[:3000] if ep else None)
          orm = get("https://openrouter.ai/api/v1/models")["data"]
          for m in orm:
              if m.get("id") in ("openrouter/free", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free", "qwen/qwen3.8-27b:free", "dots-studio/dots-3-note-preview:free"):
                  print("OR_MODEL", json.dumps({k: m.get(k) for k in ("id", "name", "description", "context_length", "pricing", "top_provider", "expiration_date")}))
          for mid in ["google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free", "qwen/qwen3.8-27b:free"]:
              ep = get(f"https://openrouter.ai/api/v1/models/{mid}/endpoints")
              print("OR_ENDPOINTS", mid, json.dumps(ep)[:3000] if ep else None)
