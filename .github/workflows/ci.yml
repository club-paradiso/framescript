name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Run each gate separately so a failure names itself in the checks list
      # rather than hiding inside one opaque "verify" step.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Build Studio
        run: npm run build:web

      - name: Build CLI and MCP server
        run: npm run build:tools

      # The fixture is generated, not committed as binary media. Regenerating it
      # in CI proves the generator still produces what the tests expect.
      - name: Regenerate media fixtures
        run: |
          node scripts/make-fixture-media.mjs
          git diff --exit-code --stat tests/fixtures/ \
            || (echo "::error::Generated fixtures differ from the committed ones" && exit 1)

      - name: Verify the CLI runs
        run: |
          node dist-tools/cli.js help > /dev/null
          node dist-tools/cli.js inspect tests/fixtures/sample.en.srt

      - name: Verify the MCP server speaks the protocol
        run: node scripts/check-mcp.mjs

      # Checks structural invariants, not timings — a runner's wall clock is
      # noise, but "a static shot skips its frames" and "a film-shaped subtitle
      # track yields film-shaped scenes" must hold on any machine.
      - name: Engine invariants
        run: npm run benchmark

  e2e:
    name: End-to-end (extension and Studio)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suites
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
