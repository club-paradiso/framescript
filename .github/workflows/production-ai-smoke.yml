name: Production AI smoke

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - 'vercel.deployment.success'

permissions:
  contents: read

concurrency:
  group: production-ai-smoke
  cancel-in-progress: true

jobs:
  live-inference:
    name: Live production inference
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.client_payload.environment == 'production' &&
       github.event.client_payload.project.id == 'prj_cqnqtSbdticO1lAoIA4Y9C4TaIeP')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate synthetic media fixture
        run: node scripts/make-fixture-media.mjs

      - name: Exercise deployed ASR and vision
        env:
          # The immutable deployment hostname may be protected even when the
          # production aliases are public. Exercise the real public production
          # surface and use /api/capabilities deployment identity to prove that
          # the alias has already been promoted to the Vercel event's Git SHA.
          FRAMESCRIPT_SMOKE_ORIGIN: https://framescript-eta.vercel.app
          FRAMESCRIPT_SMOKE_ASR_MODEL: fish-audio/transcribe-1
          FRAMESCRIPT_SMOKE_VISION_MODEL: google/gemini-3.5-flash-lite
          FRAMESCRIPT_SMOKE_GIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || '' }}
          FRAMESCRIPT_SMOKE_ENVIRONMENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.environment || '' }}
        run: node scripts/production-ai-smoke.mjs
